{{define "upload"}}
{{template "site-start" .}}

  <main class="max-w-xl mx-auto px-4 py-12 w-full">
    <a href="/posts" class="text-sm text-muted-light hover:text-gray-900 transition-colors inline-block mb-6">
      ← 返回博客
    </a>

    <div class="bg-white border border-muted-border rounded-card p-6 sm:p-8">
      <h1 class="text-2xl font-extrabold mb-2">上传文章</h1>
      <p class="text-sm text-muted mb-6">选择 .md 文件，文件名即文章链接，标题取自第一个 # 标题。</p>

      {{if .Success}}
      <div class="bg-accent-subtle border border-accent/20 text-accent rounded-lg p-4 mb-6">
        <p class="font-medium">✅ 上传成功！</p>
        <a href="/posts/{{pathEscape .Slug}}" class="underline hover:no-underline text-sm">查看文章 →</a>
      </div>
      {{end}}

      {{if .Error}}
      <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 mb-6 text-sm">
        <p>{{.Error}}</p>
      </div>
      {{end}}

      <form method="POST" enctype="multipart/form-data" class="space-y-5">
        <div
          class="border-2 border-dashed border-muted-border rounded-xl p-8 text-center hover:border-accent/30 transition-colors cursor-pointer bg-gray-50"
          data-upload-dropzone
        >
          <svg class="mx-auto mb-3 text-muted-light" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <path d="M12 18v-6M9 15l3-3 3 3"/>
          </svg>
          <p class="text-sm text-muted mb-1">点击选择 .md 文件</p>
          <p class="text-xs text-muted-light" id="file-name-hint">支持 .md 和 .markdown 格式</p>
          <input
            type="file"
            name="file"
            accept=".md,.markdown,text/markdown"
            required
            class="hidden"
            data-upload-input
          >
        </div>

        <button
          type="submit"
          class="w-full px-6 py-3 bg-accent text-white text-sm font-medium rounded-lg hover:bg-[#0052a3] transition-colors"
        >
          上传并发布
        </button>
      </form>
    </div>
  </main>

{{template "site-end" .}}
{{end}}
