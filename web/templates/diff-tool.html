{{define "diff-tool"}}
{{template "site-start" .}}

  <main class="mx-auto flex w-full max-w-6xl flex-1 flex-col px-4 py-8">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div>
        <a href="/tools" class="text-sm text-gray-400 transition-colors hover:text-gray-600">← 工具</a>
        <h1 class="mt-1 text-2xl font-extrabold">文本对比</h1>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" data-diff-swap class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-500 transition-colors hover:bg-gray-100">
          交换
        </button>
        <button type="button" data-diff-clear class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-500 transition-colors hover:bg-gray-100">
          清空
        </button>
        <button type="button" data-diff-run class="rounded-lg bg-accent px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-[#0052a3]">
          对比
        </button>
      </div>
    </div>

    <div class="diff-editors mb-4">
      <section class="tool-panel" aria-label="原始文本">
        <div class="tool-panel-header">原始文本（基准）</div>
        <div class="code-editor">
          <div class="line-nums" id="left-nums" aria-hidden="true">1</div>
          <textarea id="left-input" placeholder="粘贴原始文本..." spellcheck="false"></textarea>
        </div>
      </section>

      <section class="tool-panel" aria-label="新文本">
        <div class="tool-panel-header">新文本（对比）</div>
        <div class="code-editor">
          <div class="line-nums" id="right-nums" aria-hidden="true">1</div>
          <textarea id="right-input" placeholder="粘贴新文本..." spellcheck="false"></textarea>
        </div>
      </section>
    </div>

    <section id="diff-result" class="hidden min-h-0 flex-1 flex-col">
      <div class="mb-3 flex shrink-0 items-center justify-between rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-xs font-medium text-gray-500">
        <span>对比结果</span>
        <span id="diff-stats"></span>
      </div>
      <div id="diff-empty-state" class="hidden mb-3 rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm text-gray-400">
        两侧文本完全一致。
      </div>
      <div class="diff-result-scroll flex-1 overflow-auto rounded-card border border-gray-200 bg-white">
        <table class="diff-table mono" id="diff-output"></table>
      </div>
    </section>
  </main>

{{template "site-end" .}}
{{end}}
