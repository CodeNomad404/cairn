{{define "login"}}
{{template "site-start" .}}

  <main class="max-w-sm mx-auto px-4 py-20 w-full">
    <h1 class="text-2xl font-extrabold mb-8 text-center">登录</h1>

    {{if .Error}}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-6 text-sm text-center">
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
        <input
          name="username" required
          class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent"
          placeholder="输入用户名"
          autocomplete="username"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
        <input
          name="password" type="password" required
          class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent/30 focus:border-accent"
          placeholder="输入密码"
          autocomplete="current-password"
        >
      </div>
      <button
        type="submit"
        class="w-full py-2.5 bg-accent text-white text-sm font-medium rounded-lg hover:bg-[#0052a3] transition-colors"
      >
        登录
      </button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      还没有账号？<a href="/register" class="text-accent hover:underline">注册</a>
    </p>
  </main>

{{template "site-end" .}}
{{end}}
