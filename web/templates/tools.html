{{define "tools"}}
{{template "site-start" .}}

  <main class="max-w-3xl mx-auto px-4 py-12 w-full">
    <h1 class="text-3xl font-extrabold tracking-tight mb-8">工具</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <a href="/tools/json" class="block bg-white border border-muted-border rounded-card p-6 hover:shadow-card hover:border-gray-200 transition-all">
        <h3 class="font-semibold mb-1">JSON 格式化</h3>
        <p class="text-sm text-gray-400">格式化、校验 JSON 数据，支持树形展开折叠</p>
      </a>
      <a href="/tools/diff" class="block bg-white border border-muted-border rounded-card p-6 hover:shadow-card hover:border-gray-200 transition-all">
        <h3 class="font-semibold mb-1">文本对比</h3>
        <p class="text-sm text-gray-400">并排对比两段文本差异，类似 Git diff</p>
      </a>
      <div class="block bg-white border border-muted-border rounded-card p-6 opacity-50">
        <h3 class="font-semibold mb-1">时间戳转换</h3>
        <p class="text-sm text-gray-400">即将上线</p>
      </div>
      <div class="block bg-white border border-muted-border rounded-card p-6 opacity-50">
        <h3 class="font-semibold mb-1">URL 编解码</h3>
        <p class="text-sm text-gray-400">即将上线</p>
      </div>
    </div>
  </main>

{{template "site-end" .}}
{{end}}
