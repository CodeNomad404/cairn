name: cairn-pbh

services:
  peerbanhelper:
    image: registry.cn-hangzhou.aliyuncs.com/ghostchu/peerbanhelper:v9.5.4
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9898:9898"
    volumes:
      - pbh-data:/app/data

volumes:
  pbh-data:
