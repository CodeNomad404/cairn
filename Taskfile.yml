version: '3'

tasks:
  dev:
    desc: Start development with hot reload
    cmds:
      - docker compose up --build

  build:
    desc: Build local development images
    cmds:
      - docker compose build

  ci:
    desc: Run the same backend and frontend checks used by CI
    cmds:
      - ./scripts/ci.sh

  deploy:
    desc: Pull and deploy the latest master branch to production
    cmds:
      - ./deploy/deploy.sh

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  db:up:
    desc: Start PostgreSQL
    cmds:
      - docker compose up -d db

  db:down:
    desc: Stop PostgreSQL
    cmds:
      - docker compose stop db

  db:migrate:
    desc: Run database migrations
    cmds:
      - docker compose build migrate
      - docker compose run --rm migrate

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy
