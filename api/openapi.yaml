openapi: 3.1.0
info:
  title: Cairn API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Register and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201': { description: Registered user and session cookie, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
  /auth/login:
    post:
      summary: Login and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: Logged-in user and session cookie, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
  /auth/logout:
    post:
      summary: End the current session
      responses:
        '204': { description: Logged out }
  /auth/me:
    get:
      summary: Get the current user
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /posts:
    get:
      summary: List published posts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Published posts, content: { application/json: { schema: { $ref: '#/components/schemas/PostList' } } } }
    post:
      summary: Publish a post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201': { description: Published post, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /posts/{slug}:
    get:
      summary: Get a published post
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Post, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /posts/{slug}/comments:
    get:
      summary: List comments for a post
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Comments }
    post:
      summary: Create a comment
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201': { description: Created comment }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /comments/{id}:
    delete:
      summary: Delete an owned comment (or any comment as admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tools/json/format:
    post:
      summary: Format JSON text
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [input], properties: { input: { type: string } } }
      responses:
        '200': { description: Formatted JSON }
  /tools/course-registration/login:
    post:
      summary: Login to the BJTU course registration system
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseRegistrationLoginRequest' }
      responses:
        '200': { description: Logged in to BJTU MIS }
        '401': { description: Cairn login required or BJTU credentials rejected }
        '404': { description: No saved course registration credentials }
        '422': { description: Captcha recognition failed }
  /tools/course-registration/courses:
    get:
      summary: Report whether BJTU course selection is open and list the current student's courses
      responses:
        '200':
          description: Course-selection status and courses; courses is empty while selection is closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseListResult' }
        '401': { description: Cairn or BJTU session required }
  /tools/course-registration/grab:
    post:
      summary: Select available courses or enqueue exact course names with no remaining seats
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseGrabRequest' }
      responses:
        '200': { description: Immediate result or created task for every exact course name }
        '401': { description: Cairn or BJTU session required }
        '422': { description: Captcha recognition failed }
  /tools/course-registration/grab-tasks:
    get:
      summary: List the current user's course grab tasks
      responses:
        '200': { description: Student worker status and course tasks }
        '401': { description: Cairn login required }
  /tools/course-registration/grab-tasks/{taskID}:
    patch:
      summary: Pause or resume one course grab task
      parameters:
        - { name: taskID, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseGrabTaskStatusRequest' }
      responses:
        '200': { description: Updated course task }
        '400': { description: Invalid task ID or status }
        '401': { description: Cairn login required }
        '404': { description: Task not found }
  /tool/mis-account/bind:
    post:
      summary: Verify and bind the current user's MIS account without starting course-grab tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [student_id, password]
              properties:
                student_id: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: Bound account; existing Tujian configuration is preserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      bound: { type: boolean }
                      student_id: { type: string, description: Masked student ID }
        '400': { description: Invalid input }
        '401': { description: Cairn login required or MIS credentials rejected }
  /tool/course-homework/list:
    get:
      summary: Read the current user's cached current-term homework; never starts synchronization
      parameters:
        - { name: course_id, in: query, schema: { type: string, maxLength: 64 } }
        - { name: status, in: query, schema: { type: string, enum: [todo, pending, overdue, submitted, upcoming, unknown, all], default: todo } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Snapshot, binding state, unfiltered counts and per-course synchronization results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeworkListResponse' }
        '400': { description: Invalid query }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tool/course-homework/get:
    get:
      summary: Read one owned homework's plain-text details and attachment names
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Details; cached content is retained if upstream details cannot be refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeworkDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/course-homework/sync:
    post:
      summary: Synchronize the current user's current-term homework with a bounded duration
      description: Duplicate requests for the same user share one run. Successful courses replace snapshots atomically; failures preserve old data. No user ID or upstream URL is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200':
          description: Synchronization result, including partial or total course failures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeworkSyncResponse' }
        '401': { description: Cairn login required or MIS authentication expired }
        '404': { description: MIS account must be bound first }
  /tool/classroom/list:
    get:
      summary: List today's BJTU classroom occupation records, synchronizing on a stale weekday snapshot
      parameters:
        - { name: period, in: query, schema: { type: integer, minimum: 1, maximum: 7 } }
        - { name: building_id, in: query, schema: { type: string, maxLength: 16 } }
        - { name: min_capacity, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Classroom occupation records and snapshot time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassroomListResult' }
        '400': { description: Invalid query parameters }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tool/accounting-book/list:
    get:
      summary: List the current user's accounting books
      responses:
        '200': { description: Accounting books, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingBookListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tool/accounting-book/get:
    get:
      summary: Get an accounting book and its category summary
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Accounting book, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingBookDetailResponse' } } } }
        '400': { description: Invalid book ID }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-book/create:
    post:
      summary: Create an accounting book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingBookInput' }
      responses:
        '201': { description: Created accounting book, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingBookResponse' } } } }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tool/accounting-book/update:
    post:
      summary: Update an accounting book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/AccountingBookInput' }
                - { type: object, required: [id], properties: { id: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Updated accounting book, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingBookResponse' } } } }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-book/delete:
    post:
      summary: Delete an accounting book and all of its expenses
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: integer, minimum: 1 } } }
      responses:
        '204': { description: Deleted accounting book and expenses }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-expense/list:
    get:
      summary: List expenses in an accounting book
      parameters:
        - { name: book_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: category, in: query, description: 0 or omitted means all categories, schema: { type: integer, enum: [0, 1, 2, 3, 4, 5, 6, 7, 8], default: 0 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Expenses, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingExpenseListResponse' } } } }
        '400': { description: Invalid query parameters }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-expense/create:
    post:
      summary: Create an expense in an accounting book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingExpenseCreateInput' }
      responses:
        '201': { description: Created expense, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingExpenseResponse' } } } }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-expense/update:
    post:
      summary: Update an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingExpenseUpdateInput' }
      responses:
        '200': { description: Updated expense, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingExpenseResponse' } } } }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-expense/delete:
    post:
      summary: Delete an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: integer, minimum: 1 } } }
      responses:
        '204': { description: Deleted expense }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tool/accounting-statistic/get:
    get:
      summary: Get monthly expense statistics by category and book
      parameters:
        - { name: month, in: query, description: Month in Asia/Shanghai; defaults to the current month, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200': { description: Monthly statistics, content: { application/json: { schema: { $ref: '#/components/schemas/AccountingMonthlyStatisticResponse' } } } }
        '400': { description: Invalid month }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  schemas:
    HomeworkItem:
      type: object
      required: [id, course_id, course_name, title, submission, status, grading]
      properties:
        id: { type: integer, format: int64 }
        course_id: { type: string }
        course_name: { type: string }
        title: { type: string }
        opens_at: { type: [string, 'null'], format: date-time }
        deadline: { type: [string, 'null'], format: date-time }
        submitted_at: { type: [string, 'null'], format: date-time }
        submission: { type: string, description: Original upstream submission status }
        status: { type: string, enum: [pending, overdue, submitted, upcoming, unknown] }
        grading: { type: string }
    HomeworkCourse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        last_attempt_at: { type: string, format: date-time }
        last_success_at: { type: [string, 'null'], format: date-time }
        error: { type: string }
    HomeworkListResponse:
      type: object
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            bound: { type: boolean }
            student_id: { type: string, description: Masked bound student ID; empty when unbound }
            has_snapshot: { type: boolean }
            term_code: { type: string }
            last_success_at: { type: [string, 'null'], format: date-time }
            courses: { type: array, items: { $ref: '#/components/schemas/HomeworkCourse' } }
            items: { type: array, items: { $ref: '#/components/schemas/HomeworkItem' } }
            counts:
              type: object
              additionalProperties: { type: integer }
            total: { type: integer }
            page: { type: integer }
            page_size: { type: integer }
    HomeworkDetailResponse:
      type: object
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            item: { $ref: '#/components/schemas/HomeworkItem' }
            content: { type: string, description: Plain text, never raw HTML }
            attachments:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
            warning: { type: string, description: Upstream failure; cached content is being shown }
    HomeworkSyncResponse:
      type: object
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            status: { type: string, enum: [success, partial, failed] }
            succeeded: { type: integer }
            failed: { type: integer }
            term_code: { type: string }
            last_success_at: { type: [string, 'null'], format: date-time }
            courses: { type: array, items: { $ref: '#/components/schemas/HomeworkCourse' } }
    ExpenseCategory:
      type: integer
      format: int32
      enum: [1, 2, 3, 4, 5, 6, 7, 8]
      description: 1 food, 2 transport, 3 accommodation, 4 shopping, 5 ticket, 6 entertainment, 7 medical, 8 other
    AccountingBookInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    AccountingBook:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountingBookSummary:
      allOf:
        - { $ref: '#/components/schemas/AccountingBook' }
        - type: object
          required: [total_amount_cents, expense_count]
          properties:
            total_amount_cents: { type: integer, minimum: 0 }
            expense_count: { type: integer, minimum: 0 }
            last_expense_at: { type: string, format: date-time }
    AccountingCategorySummary:
      type: object
      required: [category, amount_cents, expense_count]
      properties:
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        amount_cents: { type: integer, minimum: 0 }
        expense_count: { type: integer, minimum: 0 }
    AccountingBookStatistic:
      type: object
      required: [book_id, book_name, amount_cents, expense_count]
      properties:
        book_id: { type: integer }
        book_name: { type: string }
        amount_cents: { type: integer, minimum: 0 }
        expense_count: { type: integer, minimum: 0 }
    AccountingExpense:
      type: object
      required: [id, book_id, amount_cents, category, spent_at, note, created_at, updated_at]
      properties:
        id: { type: integer }
        book_id: { type: integer }
        amount_cents: { type: integer, minimum: 1 }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        spent_at: { type: string, format: date-time }
        note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountingExpenseCreateInput:
      type: object
      required: [book_id, amount_cents, category, spent_at]
      properties:
        book_id: { type: integer, minimum: 1 }
        amount_cents: { type: integer, minimum: 1 }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        spent_at: { type: string, format: date-time }
        note: { type: string, maxLength: 200 }
    AccountingExpenseUpdateInput:
      type: object
      required: [id, amount_cents, category, spent_at]
      properties:
        id: { type: integer, minimum: 1 }
        amount_cents: { type: integer, minimum: 1 }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        spent_at: { type: string, format: date-time }
        note: { type: string, maxLength: 200 }
    AccountingBookResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data: { $ref: '#/components/schemas/AccountingBook' }
    AccountingBookListResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AccountingBookSummary' } }
    AccountingBookDetailResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data:
          allOf:
            - { $ref: '#/components/schemas/AccountingBookSummary' }
            - type: object
              required: [categories]
              properties:
                categories: { type: array, items: { $ref: '#/components/schemas/AccountingCategorySummary' } }
    AccountingExpenseResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data: { $ref: '#/components/schemas/AccountingExpense' }
    AccountingExpenseListResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data:
          type: object
          required: [items, page, page_size, has_more]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AccountingExpense' } }
            page: { type: integer }
            page_size: { type: integer }
            has_more: { type: boolean }
    AccountingMonthlyStatisticResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data:
          type: object
          required: [month, total_amount_cents, by_category, by_book]
          properties:
            month: { type: string }
            total_amount_cents: { type: integer, minimum: 0 }
            by_category: { type: array, items: { $ref: '#/components/schemas/AccountingCategorySummary' } }
            by_book: { type: array, items: { $ref: '#/components/schemas/AccountingBookStatistic' } }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    CourseRegistrationCredentials:
      type: object
      required: [student_id, password, tujian_username, tujian_password]
      properties:
        student_id: { type: string }
        password: { type: string, format: password }
        tujian_username: { type: string }
        tujian_password: { type: string, format: password }
    CourseRegistrationLoginRequest:
      oneOf:
        - { $ref: '#/components/schemas/CourseRegistrationCredentials' }
        - { type: object, maxProperties: 0 }
        - type: object
          additionalProperties: false
          required: [tujian_username, tujian_password]
          properties:
            tujian_username: { type: string, minLength: 1 }
            tujian_password: { type: string, minLength: 1, format: password }
    CourseListResult:
      type: object
      required: [selection_open, courses]
      properties:
        selection_open: { type: boolean }
        courses:
          type: array
          items:
            type: object
            required: [name, teacher, remaining, selected]
            properties:
              id: { type: string }
              name: { type: string }
              teacher: { type: string }
              remaining: { type: integer }
              selected: { type: boolean }
    CourseGrabRequest:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 256 }
    CourseGrabTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [grabbing, paused] }
    ClassroomListResult:
      type: object
      required: [date, rooms]
      properties:
        date: { type: string, format: date }
        period: { type: integer, minimum: 1, maximum: 7 }
        synced_at: { type: string, format: date-time }
        rooms:
          type: array
          items:
            type: object
            required: [period, building_id, building_name, room_name, capacity, occupation_type]
            properties:
              period: { type: integer, minimum: 1, maximum: 7 }
              building_id: { type: string }
              building_name: { type: string }
              room_name: { type: string }
              capacity: { type: integer }
              occupation_type: { type: string, enum: [free, scheduled, rescheduled, exam, laboratory, other] }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        created_at: { type: string, format: date-time }
    PostInput:
      type: object
      required: [slug, title, content_md]
      properties:
        slug: { type: string }
        title: { type: string }
        content_md: { type: string }
    Post:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        content_html: { type: string }
        published_at: { type: string, format: date-time }
    PostList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Post' } }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
    CommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 4000 }
        parent_id: { type: integer, nullable: true }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized: { description: Login required }
    Forbidden: { description: Insufficient permission }
    NotFound: { description: Resource not found }
